<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hệ thống Quản lý Chi tiêu</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Hệ thống Quản lý Chi tiêu</h1>
    <p class="ip-badge">Expense Tracker - Docker Compose</p>

    <form id="expenseForm">
      <label class="visually-hidden" for="title">Tên khoản chi</label>
      <input type="text" id="title" name="title" placeholder="Tên khoản chi (VD: Mua sách)" maxlength="100" required>
      <label class="visually-hidden" for="amount">Số tiền</label>
      <input type="number" id="amount" name="amount" placeholder="Số tiền (VNĐ)" min="1" step="0.01" required>
      <label class="visually-hidden" for="category">Danh mục</label>
      <select id="category" name="category">
        <option value="Ăn uống">Ăn uống</option>
        <option value="Giải trí">Giải trí</option>
        <option value="Hóa đơn">Hóa đơn</option>
        <option value="Khác">Khác</option>
      </select>
      <button type="submit">Thêm chi tiêu</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <h2>Danh sách chi tiêu</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">Thời gian</th>
            <th scope="col">Danh mục</th>
            <th scope="col">Nội dung</th>
            <th scope="col">Số tiền (VNĐ)</th>
            <th scope="col">Hành động</th>
          </tr>
        </thead>
        <tbody id="expenseList"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
